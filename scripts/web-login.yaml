# Midscene.js YAML Test Script - Web Login
# Run: npx midscene ./scripts/web-login.yaml

target:
  url: https://example.com/login

tasks:
  - name: Login with valid credentials
    flow:
      - aiAction: 在用户名输入框中输入 testuser
      - aiAction: 在密码输入框中输入 password123
      - aiAction: 点击登录按钮
      - aiAssert: 页面显示了欢迎信息或仪表盘界面

  - name: Login with invalid credentials
    flow:
      - aiAction: 在用户名输入框中输入 wronguser
      - aiAction: 在密码输入框中输入 wrongpass
      - aiAction: 点击登录按钮
      - aiAssert: 页面显示了错误提示信息
